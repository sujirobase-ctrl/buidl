plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.sujirobase.buidl'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.sujirobase.buidl'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.5.2-mobile'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        buildConfig true
        compose true
    }
    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            matchingFallbacks = ['debug']
        }
    }
    testBuildType project.hasProperty('qa') ? 'qa' : 'debug'
}

// Copy only the desktop engine, never cookies, downloads, EXEs or the Tk UI.
tasks.register('stagePythonEngine', Sync) {
    from('../../src') {
        include '**/*.py'
        exclude 'preview.py', 'preview_gui.py', 'video_preview.py', 'video_preview_gui.py'
    }
    into(layout.buildDirectory.dir('generated/python/src'))
}
chaquopy {
    defaultConfig {
        version '3.14'
        def configuredPython = System.getenv('CHAQUOPY_PYTHON')
        def localPython = rootProject.file('../.venv/Scripts/python.exe')
        buildPython configuredPython ?: (localPython.exists() ? localPython.absolutePath : 'python3.14')
        pip {
            install 'requests==2.32.5'
            install 'beautifulsoup4==4.14.3'
        }
    }
    sourceSets {
        main {
            srcDir 'src/main/python'
            srcDir layout.buildDirectory.dir('generated/python')
        }
    }
}
tasks.configureEach {
    if (name.contains('Python') && name != 'stagePythonEngine') { dependsOn 'stagePythonEngine' }
}
dependencies {
    implementation 'androidx.core:core:1.16.0'
    // Stable Compose generation compatible with AGP 8.13 / compileSdk 36.
    // Newer 1.12 artifacts require AGP 9.1 and API 37, which Chaquopy does not yet target here.
    def composeBom = platform('androidx.compose:compose-bom:2025.10.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3.adaptive:adaptive:1.1.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
