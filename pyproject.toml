[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buidl"
dynamic = ["version"]
description = "CLI downloader for media linked in XenForo forum threads (images, videos, files)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "isaac" }]
keywords = ["xenforo", "forum", "downloader", "media", "simpcity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "customtkinter>=5.2.2,<6",
]

[project.optional-dependencies]
build = [
    "build>=1.2.2",
    "pyinstaller>=6.0.0",
    "wheel>=0.45.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/sujirobase-ctrl/buidl"

[project.scripts]
buidl = "downloader:main"
buidl-batch = "main:main"
buidl-gui = "gui:main"

[tool.setuptools]
py-modules = ["downloader", "main", "gui"]
packages = [
    "src",
    "src.downloaders",
    "src.parsers",
    "src.managers",
]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
