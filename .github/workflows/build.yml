name: Build buidl (exe + wheel)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Build exe (PyInstaller)
        run: pyinstaller --onefile --name buidl --paths src downloader.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buidl-dist
          path: |
            dist/buidl.exe
            dist/*.whl
          if-no-files-found: error

      # ---- Continuous release on every push to main ----
      - name: Publish continuous release (push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete continuous --yes || true
          gh release create continuous \
            --prerelease \
            --title "continuous (latest from main)" \
            --notes "Automated build from the latest commit on main. Exe + wheel attached." \
            dist/buidl.exe dist/*.whl

      # ---- Versioned release on tag v* ----
      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/buidl.exe dist/*.whl
