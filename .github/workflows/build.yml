name: Build and release BUIDL

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Qt system libraries for headless tests
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run offline test suite
        run: python -m pytest tests --ignore=tests/test_e2e.py -q
      - name: Run local end-to-end tests
        run: python -m tests.test_e2e

  windows:
    name: Windows GUI executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt build
      - name: Build the Windows GUI
        run: pyinstaller --clean --noconfirm buidl-gui.spec
      - name: Verify bundled GoFile runtime
        run: python tests/packaged_gofile_smoke.py dist/buidl-gui.exe
      - name: Verify packaged TLS runtime
        run: python tests/packaged_https_smoke.py dist/buidl-gui.exe
      - name: Collect Windows GUI
        run: mkdir release; copy dist/buidl-gui.exe release/BUIDL-gui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Windows
          path: release/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect Android artifact
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/BUIDL-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Android
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: actions/download-artifact@v4
        with:
          pattern: BUIDL-*
          path: release-assets
          merge-multiple: true
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/BUIDL-android.apk release-assets/BUIDL-gui.exe --verify-tag --generate-notes --title "BUIDL $GITHUB_REF_NAME"
