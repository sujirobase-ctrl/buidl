name: Test and build buidl

on:
  pull_request:
  push:
    branches: [main, exe-gui]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: buidl --version

  build:
    name: Build Windows EXE and wheel
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip ".[build]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Build CLI EXE
        run: pyinstaller --clean --noconfirm buidl.spec

      - name: Build GUI EXE
        run: pyinstaller --clean --noconfirm buidl-gui.spec

      - name: Smoke-test built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          buidl --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buidl-dist-${{ github.sha }}
          path: |
            dist/buidl.exe
            dist/buidl-gui.exe
            dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: buidl-dist-${{ github.sha }}
          path: dist

      - name: Publish continuous release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "continuous (latest from main)" \
            --notes "Automated, tested build from commit $GITHUB_SHA." \
            dist/buidl.exe dist/buidl-gui.exe dist/*.whl

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/buidl.exe dist/buidl-gui.exe dist/*.whl
